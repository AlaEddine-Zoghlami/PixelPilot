name: Build
on:
  push:
    branches:
      - 'master'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Decode the base64 keystore secret into a real .jks file for signing.
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE != ''
        run: echo "$ANDROID_KEYSTORE" | base64 -d > fpv.jks

      # Release-signed APK (alias `fpv`, store/key password from KEYSTORE_PASSWORD).
      # If the keystore secret is absent we fall back to the debug-signed APK so CI
      # stays green on forks without signing secrets.
      - name: Build release APK
        if: env.ANDROID_KEYSTORE != ''
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/fpv.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEYSTORE_PASSWORD
          mv app/build/outputs/apk/release/app-release.apk PixelPilot.apk

      - name: Build debug APK (no signing secret)
        if: env.ANDROID_KEYSTORE == ''
        run: |
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk PixelPilot.apk

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'master' && 'latest' || github.ref_name }}
          files: PixelPilot.apk
