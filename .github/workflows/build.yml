name: Build
on:
  push:
    branches:
      - 'master'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Signing is intentionally dropped for now: build the DEBUG APK, which is
      # signed with the auto-generated debug key (installable, no secrets needed),
      # so CI is green without a keystore. To restore signed release builds:
      #   1. re-add `environment: ANDROID_KEYSTORE` to this job
      #   2. set the ANDROID_KEYSTORE (base64 of a valid .jks, alias `pixelpilot`)
      #      and KEYSTORE_PASSWORD environment secrets
      #   3. swap the step below back to:
      #        ./gradlew assembleRelease \
      #          -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
      #          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
      #          -Pandroid.injected.signing.key.alias=pixelpilot \
      #          -Pandroid.injected.signing.key.password=$KEYSTORE_PASSWORD
      - name: Build debug APK
        run: |
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk PixelPilot.apk

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'master' && 'latest' || github.ref_name }}
          files: PixelPilot.apk
