plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.googleServices)
    alias(libs.plugins.firebaseCrashlytics)
}

android {
    namespace = "com.openipc.pixelpilot"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.openipc.pixelpilot"
        minSdk = 28
        targetSdk = 34
        versionCode = 5
        versionName = "0.4.8"
    }

    signingConfigs {
        create("release") {
            storeFile = file("../fpv.jks")
            storePassword = "release"
            keyAlias = "fpv"
            keyPassword = "release"
        }
    }

    buildTypes {
        release {
            debuggable true            // allow run-as for prefs injection (dongle/Taiga setup)
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'
            // Crashlytics symbolication for the real Firebase project
            // (pixelpilot-f9e5c): upload the R8 mapping for readable Java
            // stack traces and the NDK symbols for native devourer/APFPV crashes.
            firebaseCrashlytics {
                mappingFileUploadEnabled true
                nativeSymbolUploadEnabled true
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }

    // Extract native libs at install (extractNativeLibs=true). The video/wfb
    // native libs DT_NEEDED the vendored prebuilts (libopus / libsodium /
    // libusb1.0); with the modern default (libs loaded straight from the APK,
    // extractNativeLibs=false) those transitive deps aren't resolved and the
    // first System.loadLibrary fails with UnsatisfiedLinkError "libopus.so not
    // found". Extracting to the install lib dir makes them resolve reliably.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildToolsVersion '35.0.0'
    ndkVersion '26.1.10909125'
}

dependencies {
    // SSH transport for AirSshClient (air-unit config, matches OpenIPC gsmenu)
    implementation 'com.github.mwiede:jsch:0.2.17'
    implementation(project(":app:mavlink"))
    implementation(project(":app:videonative"))
    implementation(project(":app:wfbngrtl8812"))

    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.philjay.mpandroidchart)

    // Firebase Crashlytics — Java + native (NDK) crash reporting.
    implementation(platform(libs.firebase.bom))
    implementation(libs.firebase.crashlytics)
    implementation(libs.firebase.crashlytics.ndk)
    implementation(libs.firebase.analytics)
}
