plugins {
    alias(libs.plugins.androidLibrary)
}

android {
    namespace = "com.openipc.videonative"
    compileSdk = 34

    defaultConfig {
        minSdk = 26
    }

    buildTypes {
        release {
            ndk {
                abiFilters.add("arm64-v8a")
                abiFilters.add("armeabi-v7a")
            }
        }
        debug {
            ndk {
                abiFilters.add("arm64-v8a")
                abiFilters.add("armeabi-v7a")
            }
        }
    }

    externalNativeBuild {
        cmake {
            path("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    // libVideoNative.so DT_NEEDEDs the vendored prebuilt libopus.so. AGP's
    // auto-bundling of CMake-linked prebuilts is unreliable across variants (it
    // landed in release but NOT debug, so the debug app crashed with
    // "libopus.so not found"). Declare the prebuilt libs dir as a jniLibs source
    // so EVERY variant packages it; pickFirst avoids a clash if AGP also bundles it.
    sourceSets {
        main {
            jniLibs.srcDirs += ["src/main/cpp/libs"]
        }
    }
    packaging {
        jniLibs {
            pickFirsts += ["**/libopus.so"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation(libs.appcompat)
    implementation(libs.material)
}
